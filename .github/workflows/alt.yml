name: alt
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs: 
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl
      - name: Invidious
        continue-on-error: true
        run: |
          curl -s -m 30 "https://api.invidious.io/instances.json?sort_by=type,users" -o inst.json || true
          jq -r '.[] | select(.[1].type=="https") | .[0]' inst.json 2>/dev/null | head -15 > hosts.txt || true
          echo "--- instance list ---"; cat hosts.txt
          ID=HwAPLk_sQ3w
          while read H; do
            echo "=== $H ==="
            curl -s -m 20 "https://$H/api/v1/videos/$ID?fields=title,author,lengthSeconds,adaptiveFormats,formatStreams,captions" -o r.json -w "http=%{http_code} size=%{size_download}\n" || true
            jq -r '[.title, .author, (.lengthSeconds|tostring), (.adaptiveFormats|length|tostring)]|@tsv' r.json 2>/dev/null || head -c 200 r.json
            echo
          done < hosts.txt
      - name: Piped
        continue-on-error: true
        run: |
          curl -s -m 25 "https://piped-instances.kavin.rocks/" -o piped.json || true
          jq -r '.[].api_url' piped.json 2>/dev/null | head -10 > phosts.txt || true
          echo "--- piped ---"; cat phosts.txt
          ID=HwAPLk_sQ3w
          while read P; do
            echo "=== $P ==="
            curl -s -m 20 "$P/streams/$ID" -o s.json -w "http=%{http_code} size=%{size_download}\n" || true
            jq -r '[.title, .uploader, (.duration|tostring), (.audioStreams|length|tostring), (.videoStreams|length|tostring), (.subtitles|length|tostring)]|@tsv' s.json 2>/dev/null || head -c 200 s.json
            echo
          done < phosts.txt
      - name: Dump
        if: always()
        run: |
          echo "done"
