name: probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg mkvtoolnix
          python3 -m pip install -U --quiet yt-dlp
          yt-dlp --version
      - name: Probe youtube
        continue-on-error: true
        run: |
          URL="https://www.youtube.com/watch?v=HwAPLk_sQ3w"
          { echo "######## DEFAULT ########"
            yt-dlp -F "$URL" 2>&1 | head -200
            echo "-----SUBS-----"
            yt-dlp --list-subs "$URL" 2>&1 | head -100
          } > probe.txt
          for CLIENT in tv_embedded web_safari android_vr ios tv mweb; do
            { echo ""
              echo "######## CLIENT=$CLIENT ########"
              yt-dlp --extractor-args "youtube:player_client=$CLIENT" -F "$URL" 2>&1 | head -200
              echo "-----SUBS-----"
              yt-dlp --extractor-args "youtube:player_client=$CLIENT" --list-subs "$URL" 2>&1 | head -100
            } >> probe.txt
          done
          yt-dlp --skip-download -J "$URL" > meta.json 2> meta.err || true
      - name: Dump probe
        if: always()
        run: |
          echo "################ BEGIN ################"
          cat probe.txt || true
          echo "################ END ################"
          echo "################ METAERR ################"
          cat meta.err || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            probe.txt
            meta.json
