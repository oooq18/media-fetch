name: diag
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg mkvtoolnix
          python3 -m pip install -U --quiet yt-dlp bgutil-ytdlp-pot-provider
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          yt-dlp --version
          yt-dlp --list-plugins 2>&1 | head -40
      - name: POT
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 15
          curl -s -m 10 -X POST http://127.0.0.1:4416/get_pot -H "Content-Type: application/json" -d '{"content_binding":"test"}' | head -c 300 || true
      - name: Verbose target
        continue-on-error: true
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          yt-dlp -v --js-runtimes deno -F "https://www.youtube.com/watch?v=HwAPLk_sQ3w" 2>&1 | grep -i -E "plugin|pot|provider|visitor|bot|client|playability" | head -60
      - name: Control video
        continue-on-error: true
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          echo "=== big buck bunny ==="
          yt-dlp --js-runtimes deno -F "https://www.youtube.com/watch?v=aqz-KE-bpKQ" 2>&1 | head -20
          echo "=== rick ==="
          yt-dlp --js-runtimes deno -F "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | head -20
      - name: Webpage status
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,re,urllib.request
          url="https://www.youtube.com/watch?v=HwAPLk_sQ3w&hl=en"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0 Safari/537.36","Accept-Language":"en-US,en;q=0.9"})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          print("html len",len(html))
          m=re.search(r'ytInitialPlayerResponse\s*=\s*(\{.+?\})\s*;\s*(?:var|</script>)',html,re.S)
          if not m:
              print("no player response"); raise SystemExit
          d=json.loads(m.group(1))
          print("playability:",json.dumps(d.get("playabilityStatus",{}))[:800])
          print("videoDetails:",json.dumps({k:d.get("videoDetails",{}).get(k) for k in ["title","author","lengthSeconds"]},ensure_ascii=False))
          sd=d.get("streamingData",{})
          print("formats:",len(sd.get("formats",[])),"adaptive:",len(sd.get("adaptiveFormats",[])))
          print("captions:",json.dumps(d.get("captions",{}))[:600])
          PY
